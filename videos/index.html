<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Videos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101214;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 50px 24px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    a {
      color: #ffffff;
      text-decoration: none;
    }

    .back {
      border: 1px solid #444;
      padding: 10px 16px;
      border-radius: 6px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .video-card {
      background: #1b1b1b;
      border-radius: 8px;
      overflow: hidden;
    }

    .video-card video {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
      background: #000000;
    }

    .video-name {
      padding: 12px 14px;
      color: #d7d7d7;
      font-size: 14px;
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .video-card video {
        height: 260px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="top">
      <h1>Videos</h1>
      <a class="back" href="/">Home</a>
    </div>

    <div class="grid">

      <div class="video-card">
        <video
          src="vidssave.comElMatador1080p60.mp4"
          controls
          preload="metadata"
          playsinline
        ></video>
        <div class="video-name">
          El Matador
        </div>
      </div>

      <div class="video-card">
        <video
          src="vidssave.comVR46Status720p.mp4"
          controls
          preload="metadata"
          playsinline
        ></video>
        <div class="video-name">
          VR46 Status
        </div>
      </div>

    </div>

  </div>

</body>
</html>
