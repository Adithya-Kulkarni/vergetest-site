<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Images</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101214;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 50px 24px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    a {
      color: #ffffff;
      text-decoration: none;
    }

    .back {
      border: 1px solid #444;
      padding: 10px 16px;
      border-radius: 6px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .grid img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
      border-radius: 8px;
      background: #1b1b1b;
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="top">
      <h1>Images</h1>
      <a class="back" href="/">Home</a>
    </div>

    <div class="grid">

      <a href="artworks-33JSsucEziFGHKbT-QR8W4Q-t500x500.jpg">
        <img
          src="artworks-33JSsucEziFGHKbT-QR8W4Q-t500x500.jpg"
          alt="Artwork"
        >
      </a>

      <a href="Pngtreeboxinggloves6129663.png">
        <img
          src="Pngtreeboxinggloves6129663.png"
          alt="Boxing gloves"
        >
      </a>

      <a href="HajimenoippoGIF.gif">
        <img
          src="HajimenoippoGIF.gif"
          alt="Hajime no Ippo"
        >
      </a>

      <a href="hajimenoippoend-hajime.gif">
        <img
          src="hajimenoippoend-hajime.gif"
          alt="Hajime no Ippo"
        >
      </a>

      <a href="mercbenz.jpg">
        <img
          src="mercbenz.jpg"
          alt="Mercedes-Benz"
        >
      </a>

    </div>

  </div>

</body>
</html>
